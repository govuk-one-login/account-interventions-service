---
name: 'Mutation Tests'
permissions:
  contents: read
  packages: read

on:
  pull_request:
    paths:
      - src/**
      - package.json
      - package-lock.json
      - stryker-ci.config.json
      - .stryker/**
      - .node-version
      - .github/workflows/mutation-tests.yaml
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

jobs:
  mutation-tests:
    name: 'Run Mutation Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # pin@v6.3.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@govuk-one-login'
          cache: npm

      - name: Run npm install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Run mutation tests
        run: npm run test:mutation:ci

      - name: Condense and store mutation testing report
        run: npm run test:mutation:condense-report

      - name: Download main mutation testing report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-condensed-main.json
          path: reports/mutation
        continue-on-error: true # Continue if this doesn't exist yet

      - name: Store mutation testing scores
        if: ${{ hashFiles('reports/mutation/mutation-condensed-main.json') != '' }} # Only if the main report downloaded successfully
        run: |
          echo "NEW_MUTATION_SCORE=`cat reports/mutation/mutation-condensed.json | jq .survivingMutants`" >> "$GITHUB_ENV"
          echo "OLD_MUTATION_SCORE=`cat reports/mutation/mutation-condensed-main.json | jq .survivingMutants`" >> "$GITHUB_ENV"

      - name: Fail if mutation score has decreased
        if: ${{ hashFiles('reports/mutation/mutation-condensed-main.json') != '' && fromJSON(env.NEW_MUTATION_SCORE) > fromJSON(env.OLD_MUTATION_SCORE) }}
        run: exit 1

      - name: Copy condensed mutation testing report to main version
        if: ${{ github.ref == 'refs/heads/main' }}
        run: cp reports/mutation/mutation-condensed.json reports/mutation/mutation-condensed-main.json

      - name: Upload canonical condensed mutation testing report
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: reports/mutation/mutation-condensed-main.json
          overwrite: true
          if-no-files-found: error
